    <div class="screen" id="content-inner"></div>

<script>
// Application installable et utilisable hors ligne (le téléphone n'a pas
// toujours de réseau ; les données, elles, sont déjà sur l'appareil).
// Le service worker exige un contexte sûr : HTTPS, ou localhost pour les essais.
if ('serviceWorker' in navigator && Install.servieCorrectement()) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
