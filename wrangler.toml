# Essor — configuration du relais bancaire pour Cloudflare Workers.
#
# Ce fichier permet à Cloudflare de déployer le relais directement depuis le
# dépôt GitHub : Workers & Pages → créer une application → importer ce dépôt.
# Cloudflare détecte cette configuration et déploie relais-cloudflare.js ;
# chaque mise à jour du dépôt redéploie le relais automatiquement.
#
# Les secrets (EB_APP_ID, EB_CLE_PRIVEE, RELAIS_CLE) ne vivent JAMAIS ici —
# ils se saisissent dans le tableau de bord : l'application déployée →
# Settings → Variables and Secrets.

name = "essor"
main = "relais-cloudflare.js"
compatibility_date = "2026-08-01"
workers_dev = true
preview_urls = false

[vars]
# L'origine autorisée à appeler le relais (modifiable dans le tableau de bord).
ORIGINES = "https://baptistecat.github.io"

# Journaux du Worker, activés depuis le tableau de bord : inscrits ici pour
# que chaque déploiement depuis le dépôt les conserve au lieu de les remettre
# à zéro. Utiles pour lire ce que répond Enable Banking en cas d'accroc.
[observability]
enabled = false
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
